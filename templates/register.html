{% extends "base.html" %}
{% block title %}Register — PrepPath{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">Prep<span>Path</span></div>
    <p class="auth-sub">Start your interview preparation journey.</p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" class="form-control"
               placeholder="Your name" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control"
               placeholder="you@email.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control"
               placeholder="Choose a strong password (min. 8 characters)" required minlength="8" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control"
               placeholder="Re-enter your password" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        Create Account
      </button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a href="{{ url_for('login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
